<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安装向导 - 论坛</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background: var(--bg-secondary); }
    .install-container {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .install-card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    .install-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .install-header .logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .install-header h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .install-header p { color: var(--text-muted); }
    .install-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .install-step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .install-step.active { color: var(--accent); font-weight: 600; }
    .install-step.done { color: var(--success); }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid currentColor;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .install-step.done .step-num {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .step-line {
      width: 40px;
      height: 2px;
      background: var(--border-color);
    }
    .step-line.done { background: var(--success); }
    .install-form .form-group { margin-bottom: 20px; }
    .install-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .check-list {
      list-style: none;
      margin: 20px 0;
    }
    .check-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: var(--text-secondary);
    }
    .check-list li i { color: var(--success); }
    .check-list li.fail i { color: var(--danger); }
  </style>
</head>
<body>
  <div class="install-container">
    <div class="install-card">
      <div class="install-header">
        <div class="logo">
          <i class="icon-message-circle"></i> 论坛
        </div>
        <h1>欢迎使用论坛系统</h1>
        <p>只需几步即可完成安装</p>
      </div>

      <!-- 步骤指示器 -->
      <div class="install-steps">
        <div class="install-step active" id="step1-indicator">
          <span class="step-num">1</span>
          <span>管理员</span>
        </div>
        <div class="step-line" id="line1"></div>
        <div class="install-step" id="step2-indicator">
          <span class="step-num">2</span>
          <span>完成</span>
        </div>
      </div>

      <!-- 步骤1：创建管理员 -->
      <div id="step1">
        <form id="install-form">
          <div class="form-group">
            <label class="form-label">管理员用户名</label>
            <input type="text" name="username" class="form-input" placeholder="用于登录后台" required minlength="3" maxlength="20">
          </div>
          <div class="form-group">
            <label class="form-label">管理员邮箱</label>
            <input type="email" name="email" class="form-input" placeholder="用于找回密码" required>
          </div>
          <div class="form-group">
            <label class="form-label">管理员密码</label>
            <input type="password" name="password" class="form-input" placeholder="至少6位字符" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <input type="password" name="password_confirm" class="form-input" placeholder="再次输入密码" required>
          </div>
          <div class="form-group">
            <label class="form-label">个人简介（可选）</label>
            <input type="text" name="bio" class="form-input" placeholder="简短介绍一下自己" maxlength="100">
          </div>

          <div id="install-error" class="form-error" style="display:none;margin-bottom:12px;"></div>

          <div class="install-actions">
            <button type="submit" class="btn btn-primary btn-lg" id="install-btn">
              <i class="icon-check"></i> 完成安装
            </button>
          </div>
        </form>
      </div>

      <!-- 步骤2：完成 -->
      <div id="step2" style="display:none;">
        <div class="empty-state" style="padding:32px 0;">
          <i class="icon-check-circle" style="font-size:64px;color:var(--success);"></i>
          <h3 style="margin-top:16px;">安装完成！</h3>
          <p>论坛系统已成功安装并准备就绪</p>
        </div>

        <ul class="check-list">
          <li><i class="icon-check"></i> 数据库已初始化</li>
          <li><i class="icon-check"></i> 默认分类已创建</li>
          <li><i class="icon-check"></i> 示例数据已导入</li>
          <li><i class="icon-check"></i> 管理员账户已创建</li>
        </ul>

        <div class="install-actions" style="justify-content:center;">
          <a href="/admin/index.html" class="btn btn-primary btn-lg">
            <i class="icon-shield"></i> 进入管理后台
          </a>
          <a href="/" class="btn btn-secondary btn-lg">
            <i class="icon-home"></i> 访问论坛
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/animated-icons.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 检查是否已初始化
      const statusRes = await fetch('/api/install/status');
      const status = await statusRes.json();
      if (status.data && status.data.initialized) {
        // 已初始化，跳过
        window.location.href = '/';
      }
    });

    document.getElementById('install-form').addEventListener('submit', async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        admin_username: formData.get('username'),
        admin_email: formData.get('email'),
        admin_password: formData.get('password'),
        admin_bio: formData.get('bio')
      };

      if (data.admin_password !== formData.get('password_confirm')) {
        document.getElementById('install-error').textContent = '两次密码输入不一致';
        document.getElementById('install-error').style.display = 'block';
        return;
      }

      const btn = document.getElementById('install-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="icon-loader"></i> 安装中...';

      try {
        const res = await fetch('/api/install', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();

        if (json.code === 200) {
          // 成功
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'block';
          document.getElementById('step1-indicator').className = 'install-step done';
          document.getElementById('step1-indicator').innerHTML = '<span class="step-num"><i class="icon-check" style="font-size:14px;"></i></span><span>管理员</span>';
          document.getElementById('line1').className = 'step-line done';
          document.getElementById('step2-indicator').className = 'install-step active';
        } else {
          document.getElementById('install-error').textContent = json.message || '安装失败';
          document.getElementById('install-error').style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="icon-check"></i> 完成安装';
        }
      } catch (err) {
        document.getElementById('install-error').textContent = '网络错误，请重试';
        document.getElementById('install-error').style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="icon-check"></i> 完成安装';
      }
    });
  </script>
</body>
</html>
