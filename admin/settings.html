<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <i class="icon-message-circle" style="font-size:1.5rem;color:var(--accent);"></i>
        <h1>论坛管理</h1>
      </div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item"><i class="icon-bar-chart-2"></i> 仪表盘</a>
        <a href="/admin/posts.html" class="admin-nav-item"><i class="icon-file-text"></i> 帖子管理</a>
        <a href="/admin/users.html" class="admin-nav-item"><i class="icon-users"></i> 用户管理</a>
        <a href="/admin/reports.html" class="admin-nav-item"><i class="icon-flag"></i> 举报管理</a>
        <a href="/admin/categories.html" class="admin-nav-item"><i class="icon-folder"></i> 分类管理</a>
        <a href="/admin/tags.html" class="admin-nav-item"><i class="icon-tag"></i> 标签管理</a>
        <a href="/admin/settings.html" class="admin-nav-item active"><i class="icon-settings"></i> 系统设置</a>
        <a href="/" class="admin-nav-item" target="_blank"><i class="icon-external-link"></i> 访问前台</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn" id="menu-btn"><i class="icon-menu"></i></button>
          <div class="admin-breadcrumb"><a href="/admin/index.html">管理后台</a> <i class="icon-chevron-right"></i> 系统设置</div>
        </div>
      </header>

      <div class="admin-content" style="max-width:800px;">
        <div class="settings-section">
          <div class="settings-section-header">
            <h3><i class="icon-info"></i> 站点信息</h3>
          </div>
          <div class="settings-section-body">
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>站点名称</h4>
                <p>显示在页面标题和导航栏</p>
              </div>
              <div class="settings-row-control">
                <input type="text" class="form-input" id="setting-site_name" style="width:240px;">
              </div>
            </div>
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>站点描述</h4>
                <p>用于 SEO 和页面描述</p>
              </div>
              <div class="settings-row-control">
                <input type="text" class="form-input" id="setting-site_description" style="width:300px;">
              </div>
            </div>
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>站点关键词</h4>
                <p>SEO 关键词，逗号分隔</p>
              </div>
              <div class="settings-row-control">
                <input type="text" class="form-input" id="setting-site_keywords" style="width:300px;">
              </div>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h3><i class="icon-shield"></i> 注册与审核</h3>
          </div>
          <div class="settings-section-body">
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>允许新用户注册</h4>
                <p>关闭后无法注册新账户</p>
              </div>
              <div class="settings-row-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-allow_register">
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>帖子发布审核</h4>
                <p>开启后新帖子需管理员审核</p>
              </div>
              <div class="settings-row-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-post_moderation">
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h3><i class="icon-file-text"></i> 显示设置</h3>
          </div>
          <div class="settings-section-body">
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>每页帖子数</h4>
                <p>帖子列表每页显示的数量</p>
              </div>
              <div class="settings-row-control">
                <input type="number" class="form-input" id="setting-posts_per_page" style="width:100px;" min="5" max="100">
              </div>
            </div>
            <div class="settings-row">
              <div class="settings-row-label">
                <h4>每页评论数</h4>
                <p>帖子详情页每页显示的评论数</p>
              </div>
              <div class="settings-row-control">
                <input type="number" class="form-input" id="setting-comments_per_page" style="width:100px;" min="10" max="200">
              </div>
            </div>
          </div>
        </div>

        <div style="margin-top:20px;">
          <button class="btn btn-primary btn-lg" id="save-btn">
            <i class="icon-check"></i> 保存设置
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/animated-icons.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
      const user = getUser();
      if (user.role !== 'admin') { Toast.error('仅管理员可访问'); window.location.href = '/'; return; }

      document.getElementById('menu-btn').addEventListener('click', () => {
        document.querySelector('.admin-sidebar').classList.toggle('open');
      });

      // 加载设置
      const res = await api.get('/settings');
      if (res && res.data) {
        const settings = res.data;
        document.getElementById('setting-site_name').value = settings.site_name || '';
        document.getElementById('setting-site_description').value = settings.site_description || '';
        document.getElementById('setting-site_keywords').value = settings.site_keywords || '';
        document.getElementById('setting-allow_register').checked = settings.allow_register === 'true';
        document.getElementById('setting-post_moderation').checked = settings.post_moderation === 'true';
        document.getElementById('setting-posts_per_page').value = settings.posts_per_page || 20;
        document.getElementById('setting-comments_per_page').value = settings.comments_per_page || 50;
      }

      // 保存设置
      document.getElementById('save-btn').addEventListener('click', async () => {
        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="icon-loader"></i> 保存中...';

        const data = {
          site_name: document.getElementById('setting-site_name').value,
          site_description: document.getElementById('setting-site_description').value,
          site_keywords: document.getElementById('setting-site_keywords').value,
          allow_register: document.getElementById('setting-allow_register').checked ? 'true' : 'false',
          post_moderation: document.getElementById('setting-post_moderation').checked ? 'true' : 'false',
          posts_per_page: document.getElementById('setting-posts_per_page').value,
          comments_per_page: document.getElementById('setting-comments_per_page').value
        };

        const res = await api.put('/settings', data);
        btn.disabled = false;
        btn.innerHTML = '<i class="icon-check"></i> 保存设置';

        if (res && res.code === 200) {
          Toast.success('设置已保存');
        } else {
          Toast.error('保存失败');
        }
      });
    });
  </script>
</body>
</html>
