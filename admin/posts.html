<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帖子管理 - 管理后台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <i class="icon-message-circle" style="font-size:1.5rem;color:var(--accent);"></i>
        <h1>论坛管理</h1>
      </div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item"><i class="icon-bar-chart-2"></i> 仪表盘</a>
        <a href="/admin/posts.html" class="admin-nav-item active"><i class="icon-file-text"></i> 帖子管理</a>
        <a href="/admin/users.html" class="admin-nav-item"><i class="icon-users"></i> 用户管理</a>
        <a href="/admin/reports.html" class="admin-nav-item"><i class="icon-flag"></i> 举报管理</a>
        <a href="/admin/categories.html" class="admin-nav-item"><i class="icon-folder"></i> 分类管理</a>
        <a href="/admin/tags.html" class="admin-nav-item"><i class="icon-tag"></i> 标签管理</a>
        <a href="/admin/settings.html" class="admin-nav-item"><i class="icon-settings"></i> 系统设置</a>
        <a href="/" class="admin-nav-item" target="_blank"><i class="icon-external-link"></i> 访问前台</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button class="admin-menu-btn" id="menu-btn"><i class="icon-menu"></i></button>
          <div class="admin-breadcrumb"><a href="/admin/index.html">管理后台</a> <i class="icon-chevron-right"></i> 帖子管理</div>
        </div>
      </header>

      <div class="admin-content">
        <div class="data-table">
          <div class="data-table-header">
            <h3>帖子列表</h3>
            <div class="data-table-search">
              <input type="text" placeholder="搜索帖子标题..." id="search-input">
              <button class="btn btn-secondary btn-sm" id="search-btn"><i class="icon-search"></i></button>
            </div>
          </div>
          <div id="post-table">
            <div class="loading"><div class="spinner"></div></div>
          </div>
          <div id="pagination" style="padding:16px;display:flex;justify-content:center;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/icons.js"></script>
  <script src="/static/js/animated-icons.js"></script>
  <script>
    let currentPage = 1;
    let searchKeyword = '';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
      const user = getUser();
      if (user.role !== 'admin' && user.role !== 'moderator') { Toast.error('无权访问'); window.location.href = '/'; return; }

      document.getElementById('search-btn').addEventListener('click', () => {
        searchKeyword = document.getElementById('search-input').value.trim();
        currentPage = 1;
        loadPosts();
      });

      document.getElementById('menu-btn').addEventListener('click', () => {
        document.querySelector('.admin-sidebar').classList.toggle('open');
      });

      await loadPosts();
    });

    async function loadPosts(page = 1) {
      currentPage = page;
      const params = new URLSearchParams({ page, per_page: 20 });
      if (searchKeyword) params.set('search', searchKeyword);

      const res = await api.get(`/posts?${params}`);
      const container = document.getElementById('post-table');

      if (!res || res.data.items.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="icon-file-text"></i><h3>暂无帖子</h3></div>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead><tr><th>标题</th><th>作者</th><th>分类</th><th>浏览</th><th>点赞</th><th>评论</th><th>操作</th></tr></thead>
          <tbody>
            ${res.data.items.map(p => `
              <tr>
                <td style="max-width:300px;">
                  <a href="/post.html?id=${p.id}" target="_blank">${escapeHtml(p.title.substring(0, 50))}${p.title.length > 50 ? '...' : ''}</a>
                  ${p.is_pinned ? '<span class="badge badge-pin" style="margin-left:4px;">置顶</span>' : ''}
                  ${p.is_featured ? '<span class="badge badge-feature" style="margin-left:4px;">精华</span>' : ''}
                </td>
                <td>${p.username}</td>
                <td>${p.category_name || '-'}</td>
                <td>${p.view_count}</td>
                <td>${p.like_count}</td>
                <td>${p.comment_count}</td>
                <td>
                  <div class="actions">
                    <button class="btn btn-ghost btn-sm" onclick="togglePin(${p.id}, ${!p.is_pinned})" title="${p.is_pinned ? '取消置顶' : '置顶'}">
                      <i class="icon-pin" style="color:${p.is_pinned ? 'var(--accent)' : ''}"></i>
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="toggleFeature(${p.id}, ${!p.is_featured})" title="${p.is_featured ? '取消精华' : '设为精华'}">
                      <i class="icon-award" style="color:${p.is_featured ? 'var(--warning)' : ''}"></i>
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="deletePost(${p.id})" title="删除">
                      <i class="icon-trash-2" style="color:var(--danger);"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      if (res.data.total_pages > 1) {
        document.getElementById('pagination').innerHTML = pagination(currentPage, res.data.total_pages);
        window.loadPage = p => loadPosts(p);
      }
    }

    async function togglePin(postId, pinned) {
      const res = await api.post(`/posts/admin/${postId}/pin`, { is_pinned: pinned });
      if (res && res.code === 200) { Toast.success(pinned ? '已置顶' : '已取消置顶'); loadPosts(currentPage); }
      else { Toast.error(res && res.message ? res.message : '操作失败'); }
    }

    async function toggleFeature(postId, featured) {
      const res = await api.post(`/posts/admin/${postId}/feature`, { is_featured: featured });
      if (res && res.code === 200) { Toast.success(featured ? '已设为精华' : '已取消精华'); loadPosts(currentPage); }
      else { Toast.error(res && res.message ? res.message : '操作失败'); }
    }

    async function deletePost(postId) {
      if (!confirm('确定删除该帖子？')) return;
      const res = await api.delete(`/posts/${postId}`);
      if (res && res.code === 200) { Toast.success('已删除'); loadPosts(currentPage); }
      else { Toast.error(res && res.message ? res.message : '删除失败'); }
    }
  </script>
</body>
</html>
